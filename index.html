  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }

    background: var(--bg);

    background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: var(--radius-btn);
    padding: 11px 12px; font-size: 0.98rem; width: 100%;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  ::selection { background: var(--gold-soft); }

  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }

  .navbar {
    position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 12px) 10px 12px;

  .navbar-side { display: flex; align-items: center; gap: 2px; min-width: 40px; }
  .navbar-side.right { justify-content: flex-end; }
  .icon-btn {
    width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; color: var(--accent);
  }
  .icon-btn:active { background: var(--accent-soft); }

  .content {
    padding: calc(env(safe-area-inset-top) + 68px) 16px calc(env(safe-area-inset-bottom) + 96px);

  .tabbar {

  .card {

  .session-card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }

  .avatar-row { display: flex; }

    width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border-radius: var(--radius-btn); padding: 13px 20px; font-weight: 600; font-size: 0.96rem;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); width: 100%; }
  .btn-primary:active { opacity: 0.85; }
  .btn-primary[disabled] { opacity: 0.4; pointer-events: none; }
  .btn-secondary { background: var(--accent-soft); color: var(--accent); width: 100%; }
  .btn-danger { background: var(--danger-soft); color: var(--danger); width: 100%; }
  .btn-ghost { color: var(--muted); font-weight: 600; padding: 10px; }

  .fab {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 76px);
    transform: translateX(calc(-50% + 152px));
    width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); z-index: 15;
  }
  .fab svg { width: 25px; height: 25px; }
  .fab:active { opacity: 0.88; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }

  .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: var(--radius-pill); padding: 8px 14px; font-size: 0.9rem; font-weight: 600;
  }
  .chip.selected { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip.disabled { opacity: 0.35; pointer-events: none; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(15,25,22,0.45); z-index: 30;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
    background: var(--surface); border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
    padding: 10px 20px calc(env(safe-area-inset-bottom) + 22px);
    animation: slide-up 0.22s cubic-bezier(.2,.8,.3,1);
  }
  .sheet-handle { width: 36px; height: 4px; border-radius: 3px; background: var(--line); margin: 6px auto 14px; }
  .sheet-title { font-family: var(--font-display); font-weight: 600; font-size: 1.28rem; margin-bottom: 16px; }
  @keyframes slide-up { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .stepper { display: flex; align-items: center; gap: 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-btn); padding: 6px 8px; width: fit-content; }
  .stepper button { width: 32px; height: 32px; border-radius: 8px; background: var(--surface); font-size: 1.1rem; font-weight: 700; color: var(--accent); display: flex; align-items: center; justify-content: center; }
  .stepper button[disabled] { opacity: 0.3; pointer-events: none; }
  .stepper .val { min-width: 26px; text-align: center; font-weight: 700; font-family: var(--font-display); font-size: 1.05rem; }

  .rank-row-list { display: flex; flex-direction: column; gap: 8px; }
  .rank-input-row, .rank-tap-row {
    display: flex; align-items: center; gap: 12px; background: var(--surface-2);
    border: 1px solid var(--line); border-radius: var(--radius-btn); padding: 10px 12px;
  }
  .rank-input-row .rlabel { font-weight: 700; color: var(--ink-soft); width: 34px; font-family: var(--font-display); }
  .rank-input-row input { flex: 1; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .rank-badge {
    width: 30px; height: 30px; border-radius: 50%; border: 1.5px dashed var(--muted);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem;
    color: var(--muted); flex-shrink: 0;
  }
  .rank-badge.set { border-style: solid; border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
  .rank-tap-row .rname { font-weight: 600; flex: 1; }
  .rank-tap-row.done { opacity: 0.55; }

  .leaderboard-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .leaderboard-row + .leaderboard-row { border-top: 1px solid var(--line); }
  .lb-rank { width: 22px; text-align: center; font-family: var(--font-display); font-weight: 700; color: var(--muted); font-size: 0.95rem; }
  .lb-rank.first { color: var(--gold); }
  .lb-name-wrap { flex: 1; min-width: 0; }
  .lb-name { font-weight: 600; font-size: 0.98rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-wins { font-size: 0.76rem; color: var(--muted); }
  .lb-points { font-family: var(--font-display); font-weight: 900; font-size: 1.35rem; color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .round-item { padding: 12px 0; }
  .round-item + .round-item { border-top: 1px solid var(--line); }
  .round-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .round-game { font-weight: 700; font-size: 0.94rem; }
  .round-results { display: flex; flex-wrap: wrap; gap: 6px; }
  .round-tag { font-size: 0.78rem; background: var(--surface-2); border-radius: var(--radius-pill); padding: 4px 10px; color: var(--ink-soft); }
  .round-tag b { color: var(--ink); font-weight: 700; }
  .round-tag.first { background: var(--gold-soft); color: var(--gold); }
  .round-tag.first b { color: var(--gold); }

  .game-card-top { display: flex; justify-content: space-between; align-items: center; }
  .game-name { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
  .game-scheme { font-size: 0.82rem; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }

  .player-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
  .player-row input { background: transparent; border: none; padding: 8px 4px; font-size: 1rem; font-weight: 600; }
  .player-row input:focus-visible { outline: none; border-bottom: 1.5px solid var(--accent); }

  .add-inline { display: flex; gap: 8px; margin-bottom: 18px; }
  .add-inline input { flex: 1; }
  .add-inline button { background: var(--accent); color: var(--accent-ink); border-radius: var(--radius-btn); padding: 0 16px; font-weight: 700; }

  .step-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 16px; }
  .step-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
  .step-dots span.on { background: var(--accent); }
</style>

<div class="app">
  <div class="navbar" id="navbar"></div>
  <div class="content" id="content"></div>
  <div class="tabbar" id="tabbar"></div>
  <div id="fab-root"></div>
  <div id="modal-root"></div>
</div>

<script>
(function () {
  "use strict";

  var STORE_KEY = "marque-points.v1";

  function uid() { return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function initials(name) {
    var parts = String(name).trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
  }
  function todayISO() {
    var d = new Date(); var m = String(d.getMonth() + 1).padStart(2, "0"); var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }
  function formatDate(iso) {
    try {
      var d = new Date(iso + "T00:00:00");
      return d.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
    } catch (e) { return iso; }
  }
  function defaultPoints(n) {
    var arr = [];
    for (var i = 0; i < n; i++) arr.push(Math.max(n - 1 - i, 0));
    return arr;
  }

  var ICONS = {
    sessions: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="3.5" width="16" height="17" rx="3.2"/><line x1="8" y1="8.5" x2="16" y2="8.5"/><line x1="8" y1="12.5" x2="13.5" y2="12.5"/><line x1="8" y1="16.2" x2="11.5" y2="16.2"/></svg>',
    games: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="8.3" cy="8.3" r="1.15" fill="currentColor" stroke="none"/><circle cx="15.7" cy="8.3" r="1.15" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.15" fill="currentColor" stroke="none"/><circle cx="8.3" cy="15.7" r="1.15" fill="currentColor" stroke="none"/><circle cx="15.7" cy="15.7" r="1.15" fill="currentColor" stroke="none"/></svg>',
    players: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.2" r="3.1"/><path d="M3.6 19c0-3.1 2.4-5.2 5.4-5.2s5.4 2.1 5.4 5.2"/><circle cx="17" cy="7.6" r="2.3" opacity="0.75"/><path d="M15.2 13.3c2.3.15 4.3 1.9 4.6 4.7" opacity="0.75"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 8 12 15 19"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4.5" y1="6.5" x2="19.5" y2="6.5"/><path d="M8 6.5V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1.5"/><path d="M6.5 6.5 7.3 19a2 2 0 0 0 2 1.9h5.4a2 2 0 0 0 2-1.9l.8-12.5"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>',
    dice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="8.3" cy="8.3" r="1.15" fill="currentColor" stroke="none"/><circle cx="15.7" cy="15.7" r="1.15" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.15" fill="currentColor" stroke="none"/></svg>'
  };

  var state = load();
  var view = { tab: "sessions", sessionId: null };
  var modal = null;

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return {
      players: [],
      games: [
        { id: uid(), name: "Uno", maxPlayers: 6, points: [1, 0, 0, 0, 0, 0] },
        { id: uid(), name: "Catane", maxPlayers: 4, points: [3, 2, 1, 0] }
      ],
      sessions: []
    };
  }
  function save() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

  function getPlayer(id) { return state.players.find(function (p) { return p.id === id; }); }
  function getGame(id) { return state.games.find(function (g) { return g.id === id; }); }
  function getSession(id) { return state.sessions.find(function (s) { return s.id === id; }); }

  function sessionStats(session) {
    var stats = {};
    session.playerIds.forEach(function (pid) { stats[pid] = { points: 0, wins: 0, games: 0 }; });
    session.rounds.forEach(function (r) {
      r.rankings.forEach(function (rk) {
        if (!stats[rk.playerId]) stats[rk.playerId] = { points: 0, wins: 0, games: 0 };
        stats[rk.playerId].points += rk.points;
        stats[rk.playerId].games += 1;
        if (rk.rank === 1) stats[rk.playerId].wins += 1;
      });
    });
    var rows = session.playerIds.map(function (pid) {
      var p = getPlayer(pid);
      return { id: pid, name: p ? p.name : "?", points: stats[pid].points, wins: stats[pid].wins };
    });
    rows.sort(function (a, b) { return b.points - a.points || b.wins - a.wins || a.name.localeCompare(b.name); });
    rows.forEach(function (row, i) {
      row.rank = (i > 0 && row.points === rows[i - 1].points) ? rows[i - 1].rank : i + 1;
    });
    return rows;
  }

  // standard competition ranking (1,2,2,4): tiedAfter[i] true means order[i] shares the previous rank
  function computeRanksWithTies(order, tiedAfter) {
    var result = [];
    var rank = 1;
    order.forEach(function (pid, i) {
      if (i > 0 && !tiedAfter[i]) rank = i + 1;
      result.push({ playerId: pid, rank: rank });
    });
    return result;
  }

  var App = window.App = {};

  // ---------- navigation ----------
  App.switchTab = function (tab) { modal = null; view.tab = tab; view.sessionId = null; renderAll(); };
  App.openSession = function (id) { view.sessionId = id; renderAll(); };
  App.backToSessions = function () { view.sessionId = null; renderAll(); };
  App.closeModal = function () { modal = null; renderAll(); };

  // ---------- confirm dialog ----------
  App.askConfirm = function (title, message, danger, actionName) {
    modal = { type: "confirm", title: title, message: message, danger: !!danger, actionName: actionName };
    renderAll();
  };
  var pendingConfirmAction = null;
  function confirmAndAsk(title, message, actionName, fn) {
    pendingConfirmAction = fn;
    modal = { type: "confirm", title: title, message: message, danger: true, actionName: actionName };
    renderAll();
  }
  App.runConfirmed = function () { var fn = pendingConfirmAction; pendingConfirmAction = null; modal = null; if (fn) fn(); renderAll(); };

  // ---------- players ----------
  App.addPlayer = function () {
    var input = document.getElementById("new-player-input");
    var name = input ? input.value.trim() : "";
    if (!name) return;
    state.players.push({ id: uid(), name: name });
    save(); renderAll();
  };
  App.renamePlayer = function (id, name) {
    var p = getPlayer(id); if (!p) return;
    name = name.trim(); if (!name) name = p.name;
    p.name = name; save();
  };
  App.deletePlayer = function (id) {
    var used = state.sessions.some(function (s) { return s.playerIds.indexOf(id) !== -1; });
    if (used) {
      modal = { type: "info", title: "Impossible de supprimer", message: "Ce joueur participe à au moins une session. Retirez-le des sessions concernées, ou laissez-le dans le classement." };
      renderAll(); return;
    }
    state.players = state.players.filter(function (p) { return p.id !== id; });
    save(); renderAll();
  };

  // ---------- games ----------
  App.openGameForm = function (gameId) {
    var g = gameId ? getGame(gameId) : null;
    modal = { type: "game-form", gameId: gameId || null, name: g ? g.name : "", maxPlayers: g ? g.maxPlayers : 4, points: g ? g.points.slice() : defaultPoints(4) };
    renderAll();
  };
  function syncGameFormFromDom() {
    if (!modal || modal.type !== "game-form") return;
    var nameEl = document.getElementById("gf-name");
    if (nameEl) modal.name = nameEl.value;
    var pts = modal.points.slice();
    for (var i = 0; i < modal.maxPlayers; i++) {
      var el = document.getElementById("gf-pt-" + i);
      if (el && el.value !== "") pts[i] = parseInt(el.value, 10) || 0;
    }
    modal.points = pts;
  }
  App.gameMaxPlayersDelta = function (delta) {
    syncGameFormFromDom();
    var n = Math.max(2, Math.min(8, modal.maxPlayers + delta));
    var pts = modal.points.slice(0, n);
    while (pts.length < n) pts.push(0);
    modal.maxPlayers = n; modal.points = pts;
    renderAll();
  };
  App.saveGameForm = function () {
    syncGameFormFromDom();
    var name = (modal.name || "").trim();
    if (!name) { flashFieldError("gf-name"); return; }
    if (modal.gameId) {
      var g = getGame(modal.gameId);
      g.name = name; g.maxPlayers = modal.maxPlayers; g.points = modal.points.slice();
    } else {
      state.games.push({ id: uid(), name: name, maxPlayers: modal.maxPlayers, points: modal.points.slice() });
    }
    save(); modal = null; renderAll();
  };
  App.deleteGame = function (id) {
    confirmAndAsk("Supprimer ce jeu ?", "Les manches déjà jouées avec ce jeu resteront dans l'historique des sessions.", "Supprimer", function () {
      state.games = state.games.filter(function (g) { return g.id !== id; });
      save();
    });
  };

  // ---------- sessions ----------
  App.openSessionCreate = function () {
    modal = { type: "session-create", name: "", date: todayISO(), selected: [] };
    renderAll();
    setTimeout(function () { var el = document.getElementById("sc-name"); if (el) el.focus(); }, 50);
  };
  function syncSessionCreateFromDom() {
    if (!modal || modal.type !== "session-create") return;
    var nameEl = document.getElementById("sc-name");
    if (nameEl) modal.name = nameEl.value;
    var dateEl = document.getElementById("sc-date");
    if (dateEl) modal.date = dateEl.value;
  }
  App.toggleSessionCreatePlayer = function (id) {
    syncSessionCreateFromDom();
    var idx = modal.selected.indexOf(id);
    if (idx === -1) modal.selected.push(id); else modal.selected.splice(idx, 1);
    renderAll();
  };
  App.addPlayerFromSessionCreate = function () {
    syncSessionCreateFromDom();
    var input = document.getElementById("sc-new-player");
    var name = input ? input.value.trim() : "";
    if (!name) return;
    var p = { id: uid(), name: name };
    state.players.push(p);
    modal.selected.push(p.id);
    save(); renderAll();
  };
  App.confirmCreateSession = function () {
    syncSessionCreateFromDom();
    var dateEl = document.getElementById("sc-date");
    var name = (modal.name || "").trim();
    var date = dateEl ? dateEl.value : todayISO();
    if (!name) { flashFieldError("sc-name"); return; }
    if (modal.selected.length < 2) return;
    var s = { id: uid(), name: name, date: date || todayISO(), playerIds: modal.selected.slice(), rounds: [] };
    state.sessions.push(s);
    save(); modal = null; view.tab = "sessions"; view.sessionId = s.id; renderAll();
  };
  App.deleteSession = function (id) {
    confirmAndAsk("Supprimer cette session ?", "Toutes les manches et scores associés seront définitivement perdus.", "Supprimer", function () {
      state.sessions = state.sessions.filter(function (s) { return s.id !== id; });
      save(); view.sessionId = null;
    });
  };
  App.deleteRound = function (sessionId, roundId) {
    confirmAndAsk("Supprimer cette manche ?", "Les points associés seront retirés du classement de la session.", "Supprimer", function () {
      var s = getSession(sessionId);
      if (s) { s.rounds = s.rounds.filter(function (r) { return r.id !== roundId; }); save(); }
    });
  };

  // ---------- round flow ----------
  App.openRoundFlow = function (sessionId) {
    if (!state.games.length) {
      modal = { type: "info", title: "Aucun jeu configuré", message: "Créez d'abord un jeu dans l'onglet Jeux, avec son barème de points par place." };
      renderAll(); return;
    }
    var session = getSession(sessionId);
    var initialSelected = session.playerIds.slice(0, Math.min(session.playerIds.length, 8));
    modal = { type: "round-flow", sessionId: sessionId, step: 1, gameId: null, selected: initialSelected, order: [], tiedAfter: [] };
    renderAll();
  };
  App.roundBack = function () {
    if (modal.step === 1) { modal = null; } else { modal.step -= 1; if (modal.step === 2) { modal.order = []; modal.tiedAfter = []; } }
    renderAll();
  };
  App.roundPickGame = function (gameId) {
    var g = getGame(gameId);
    modal.gameId = gameId;
    if (modal.selected.length > g.maxPlayers) modal.selected = modal.selected.slice(0, g.maxPlayers);
    modal.step = 2;
    renderAll();
  };
  App.roundToggleParticipant = function (pid) {
    var g = getGame(modal.gameId);
    var idx = modal.selected.indexOf(pid);
    if (idx !== -1) { modal.selected.splice(idx, 1); }
    else { if (modal.selected.length >= g.maxPlayers) return; modal.selected.push(pid); }
    renderAll();
  };
  App.roundGoToRanking = function () {
    if (modal.selected.length < 2) return;
    modal.step = 3; modal.order = []; modal.tiedAfter = [];
    renderAll();
  };
  App.roundTap = function (pid) {
    var idx = modal.order.indexOf(pid);
    if (idx !== -1) { modal.order.splice(idx, 1); modal.tiedAfter.splice(idx, 1); }
    else { modal.order.push(pid); modal.tiedAfter.push(false); }
    renderAll();
  };
  App.roundToggleTie = function (idx) {
    if (idx <= 0) return;
    modal.tiedAfter[idx] = !modal.tiedAfter[idx];
    renderAll();
  };
  App.roundResetRanking = function () { modal.order = []; modal.tiedAfter = []; renderAll(); };
  App.roundConfirm = function () {
    var g = getGame(modal.gameId);
    var session = getSession(modal.sessionId);
    var ranks = computeRanksWithTies(modal.order, modal.tiedAfter);
    var rankings = ranks.map(function (r) {
      var p = getPlayer(r.playerId);
      return { playerId: r.playerId, playerName: p ? p.name : "?", rank: r.rank, points: g.points[r.rank - 1] != null ? g.points[r.rank - 1] : 0 };
    });
    session.rounds.push({ id: uid(), gameId: g.id, gameName: g.name, rankings: rankings, ts: Date.now() });
    save(); modal = null; renderAll();
  };

  function flashFieldError(id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.style.borderColor = "var(--danger)";
    el.focus();
    setTimeout(function () { el.style.borderColor = ""; }, 900);
  }

  // ================= RENDER =================
  function renderAll() { renderNavbar(); renderContent(); renderTabbar(); renderFab(); renderModal(); }

  function navTitle() {
    if (view.tab === "sessions") return view.sessionId ? (getSession(view.sessionId) ? getSession(view.sessionId).name : "Session") : "Marque-Points";
    if (view.tab === "games") return "Jeux";
    return "Joueurs";
  }

  function renderNavbar() {
    var left = "", right = "";
    if (view.tab === "sessions" && view.sessionId) {
      left = '<button class="icon-btn" onclick="App.backToSessions()">' + ICONS.back + '</button>';
      right = '<button class="icon-btn danger" onclick="App.deleteSession(\'' + view.sessionId + '\')">' + ICONS.trash + '</button>';
    } else if (view.tab === "sessions") {
      right = '<button class="icon-btn" onclick="App.openSessionCreate()">' + ICONS.plus + '</button>';
    } else if (view.tab === "games") {
      right = '<button class="icon-btn" onclick="App.openGameForm(null)">' + ICONS.plus + '</button>';
    }
    document.getElementById("navbar").innerHTML =
      '<div class="navbar-side">' + (left || "") + '</div>' +
      '<div class="navbar-title">' + esc(navTitle()) + '</div>' +
      '<div class="navbar-side right">' + (right || "") + '</div>';
  }

  function renderTabbar() {
    function tab(key, icon, label) {
      return '<button class="tab' + (view.tab === key ? " active" : "") + '" onclick="App.switchTab(\'' + key + '\')">' + icon + "<span>" + label + "</span></button>";
    }
    document.getElementById("tabbar").innerHTML =
      tab("sessions", ICONS.sessions, "Sessions") + tab("games", ICONS.games, "Jeux") + tab("players", ICONS.players, "Joueurs");
  }

  function renderFab() {
    var root = document.getElementById("fab-root");
    if (view.tab === "sessions" && view.sessionId) {
      root.innerHTML = '<button class="fab" onclick="App.openRoundFlow(\'' + view.sessionId + '\')">' + ICONS.plus + '</button>';
    } else { root.innerHTML = ""; }
  }

  function renderContent() {
    var el = document.getElementById("content");
    if (view.tab === "sessions") {
      el.innerHTML = view.sessionId ? sessionDetailHTML(view.sessionId) : sessionsListHTML();
    } else if (view.tab === "games") {
      el.innerHTML = gamesListHTML();
    } else {
      el.innerHTML = playersListHTML();
    }
  }

  function sessionsListHTML() {
    if (!state.sessions.length) {
      return '<div class="empty-state">' + ICONS.dice +
        '<h3>Aucune session pour l\'instant</h3>' +
        '<p>Créez une session pour une soirée jeux, choisissez les participants, puis ajoutez les manches au fur et à mesure.</p>' +
        '<button class="btn btn-primary" onclick="App.openSessionCreate()">Créer une session</button></div>';
    }
    var sorted = state.sessions.slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || "") || (b.id > a.id ? 1 : -1); });
    return sorted.map(function (s) {
      var avatars = s.playerIds.slice(0, 5).map(function (pid) {
        var p = getPlayer(pid);
        return '<div class="avatar">' + esc(initials(p ? p.name : "?")) + '</div>';
      }).join("");
      var extra = s.playerIds.length > 5 ? '<div class="avatar">+' + (s.playerIds.length - 5) + '</div>' : "";
      return '<div class="card tap" onclick="App.openSession(\'' + s.id + '\')">' +
        '<div class="session-card-top"><div class="session-name">' + esc(s.name) + '</div><div class="session-date">' + esc(formatDate(s.date)) + '</div></div>' +
        '<div class="session-meta"><div class="avatar-row">' + avatars + extra + '</div><div class="pill">' + s.rounds.length + ' manche' + (s.rounds.length !== 1 ? "s" : "") + '</div></div>' +
        '</div>';
    }).join("");
  }

  function sessionDetailHTML(id) {
    var s = getSession(id);
    if (!s) return "";
    var stats = sessionStats(s);
    var lb = stats.map(function (row, i) {
      return '<div class="leaderboard-row">' +
        '<div class="lb-rank' + (row.rank === 1 && row.points > 0 ? " first" : "") + '">' + row.rank + '</div>' +
        '<div class="lb-name-wrap"><div class="lb-name">' + esc(row.name) + '</div><div class="lb-wins">' + row.wins + ' victoire' + (row.wins !== 1 ? "s" : "") + '</div></div>' +
        '<div class="lb-points">' + row.points + '</div></div>';
    }).join("");

    var roundsSorted = s.rounds.slice().sort(function (a, b) { return b.ts - a.ts; });
    var roundsHTML = roundsSorted.length ? roundsSorted.map(function (r) {
      var tags = r.rankings.map(function (rk) {
        return '<span class="round-tag' + (rk.rank === 1 ? " first" : "") + '">' + esc(rk.playerName) + ' <b>+' + rk.points + '</b></span>';
      }).join("");
      return '<div class="round-item"><div class="round-top"><div class="round-game">' + esc(r.gameName) + '</div>' +
        '<button class="icon-btn danger" style="width:28px;height:28px" onclick="App.deleteRound(\'' + s.id + '\',\'' + r.id + '\')">' + ICONS.trash + '</button></div>' +
        '<div class="round-results">' + tags + '</div></div>';
    }).join("") : '<p style="color:var(--muted);font-size:0.9rem;padding:8px 2px 0">Aucune manche enregistrée. Touchez le bouton + pour ajouter la première.</p>';

    return '<div class="section-label">Classement</div><div class="card">' + (lb || '<p style="color:var(--muted);font-size:0.9rem">Aucun participant.</p>') + '</div>' +
      '<div class="section-label" style="margin-top:22px">Manches jouées</div><div class="card">' + roundsHTML + '</div>';
  }

  function gamesListHTML() {
    if (!state.games.length) {
      return '<div class="empty-state">' + ICONS.games +
        '<h3>Aucun jeu configuré</h3><p>Ajoutez un jeu et définissez ses points par place (1er, 2e, 3e…).</p>' +
        '<button class="btn btn-primary" onclick="App.openGameForm(null)">Créer un jeu</button></div>';
    }
    return state.games.map(function (g) {
      var scheme = g.points.map(function (p, i) { return (i + 1) + (i === 0 ? "er" : "e") + " " + p; }).join(" · ");
      return '<div class="card tap" onclick="App.openGameForm(\'' + g.id + '\')">' +
        '<div class="game-card-top"><div class="game-name">' + esc(g.name) + '</div><div class="pill">' + g.maxPlayers + ' joueurs max</div></div>' +
        '<div class="game-scheme">' + scheme + '</div></div>';
    }).join("");
  }

  function playersListHTML() {
    var addForm = '<div class="add-inline"><input type="text" id="new-player-input" placeholder="Nom du joueur" onkeydown="if(event.key===\'Enter\')App.addPlayer()"><button onclick="App.addPlayer()">Ajouter</button></div>';
    if (!state.players.length) {
      return addForm + '<div class="empty-state" style="padding-top:24px">' + ICONS.players +
        '<h3>Aucun joueur</h3><p>Ajoutez les habitués de vos soirées jeux — vous pourrez les choisir rapidement à chaque session.</p></div>';
    }
    var rows = state.players.map(function (p) {
      return '<div class="card" style="padding:6px 10px"><div class="player-row">' +
        '<div class="avatar">' + esc(initials(p.name)) + '</div>' +
        '<input type="text" value="' + esc(p.name) + '" onchange="App.renamePlayer(\'' + p.id + '\', this.value)">' +
        '<button class="icon-btn danger" onclick="App.deletePlayer(\'' + p.id + '\')">' + ICONS.trash + '</button>' +
        '</div></div>';
    }).join("");
    return addForm + rows;
  }

  // ---------- modal rendering ----------
  function renderModal() {
    var root = document.getElementById("modal-root");
    if (!modal) { root.innerHTML = ""; return; }
    var inner = "";
    if (modal.type === "session-create") inner = sessionCreateModalHTML();
    else if (modal.type === "game-form") inner = gameFormModalHTML();
    else if (modal.type === "round-flow") inner = roundFlowModalHTML();
    else if (modal.type === "confirm") inner = confirmModalHTML();
    else if (modal.type === "info") inner = infoModalHTML();
    root.innerHTML = '<div class="modal-backdrop" onclick="App.closeModal()"><div class="sheet" onclick="event.stopPropagation()"><div class="sheet-handle"></div>' + inner + '</div></div>';
  }

  function sessionCreateModalHTML() {
    var roster = state.players.map(function (p) {
      var sel = modal.selected.indexOf(p.id) !== -1;
      return '<button class="chip' + (sel ? " selected" : "") + '" onclick="App.toggleSessionCreatePlayer(\'' + p.id + '\')">' + esc(p.name) + '</button>';
    }).join("");
    return '<div class="sheet-title">Nouvelle session</div>' +
      '<div class="field"><label>Nom</label><input type="text" id="sc-name" placeholder="Ex. Soirée jeux du samedi" value="' + esc(modal.name) + '"></div>' +
      '<div class="field"><label>Date</label><input type="date" id="sc-date" value="' + esc(modal.date) + '"></div>' +
      '<div class="field"><label>Participants (' + modal.selected.length + ')</label>' +
      '<div class="chip-grid">' + (roster || '<span style="color:var(--muted);font-size:0.88rem">Aucun joueur enregistré pour l\'instant.</span>') + '</div></div>' +
      '<div class="field"><label>Ajouter un nouveau joueur</label><div class="add-inline"><input type="text" id="sc-new-player" placeholder="Nom" onkeydown="if(event.key===\'Enter\'){event.preventDefault();App.addPlayerFromSessionCreate();}"><button onclick="App.addPlayerFromSessionCreate()">Ajouter</button></div></div>' +
      '<button class="btn btn-primary" ' + (modal.selected.length < 2 ? "disabled" : "") + ' onclick="App.confirmCreateSession()">Créer la session' + (modal.selected.length < 2 ? " (2 joueurs min.)" : "") + '</button>';
  }

  function gameFormModalHTML() {
    var pointsRows = "";
    for (var i = 0; i < modal.maxPlayers; i++) {
      var label = (i + 1) + (i === 0 ? "er" : "e");
      pointsRows += '<div class="rank-input-row"><div class="rlabel">' + label + '</div><input type="number" id="gf-pt-' + i + '" value="' + (modal.points[i] != null ? modal.points[i] : 0) + '"></div>';
    }
    return '<div class="sheet-title">' + (modal.gameId ? "Modifier le jeu" : "Nouveau jeu") + '</div>' +
      '<div class="field"><label>Nom du jeu</label><input type="text" id="gf-name" placeholder="Ex. Uno, Catane…" value="' + esc(modal.name) + '"></div>' +
      '<div class="field"><label>Nombre de joueurs max</label><div class="stepper">' +
      '<button ' + (modal.maxPlayers <= 2 ? "disabled" : "") + ' onclick="App.gameMaxPlayersDelta(-1)">−</button><div class="val">' + modal.maxPlayers + '</div>' +
      '<button ' + (modal.maxPlayers >= 8 ? "disabled" : "") + ' onclick="App.gameMaxPlayersDelta(1)">+</button></div></div>' +
      '<div class="field"><label>Points par place</label><div class="rank-row-list">' + pointsRows + '</div></div>' +
      '<button class="btn btn-primary" onclick="App.saveGameForm()" style="margin-bottom:8px">Enregistrer</button>' +
      (modal.gameId ? '<button class="btn btn-danger" onclick="App.deleteGame(\'' + modal.gameId + '\')">Supprimer ce jeu</button>' : "");
  }

  function roundFlowModalHTML() {
    var dots = [1, 2, 3].map(function (n) { return '<span class="' + (n <= modal.step ? "on" : "") + '"></span>'; }).join("");
    var body = "";
    if (modal.step === 1) {
      body = '<div class="sheet-title">Quel jeu ?</div><div class="rank-row-list">' + state.games.map(function (g) {
        return '<div class="rank-tap-row" style="cursor:pointer" onclick="App.roundPickGame(\'' + g.id + '\')"><div class="rname">' + esc(g.name) + '</div><div class="pill">' + g.maxPlayers + ' max</div></div>';
      }).join("") + '</div>';
    } else if (modal.step === 2) {
      var g = getGame(modal.gameId);
      var session = getSession(modal.sessionId);
      var chips = session.playerIds.map(function (pid) {
        var p = getPlayer(pid); var sel = modal.selected.indexOf(pid) !== -1;
        var disabled = !sel && modal.selected.length >= g.maxPlayers;
        return '<button class="chip' + (sel ? " selected" : "") + (disabled ? " disabled" : "") + '" onclick="App.roundToggleParticipant(\'' + pid + '\')">' + esc(p.name) + '</button>';
      }).join("");
      body = '<div class="sheet-title">Qui joue à ' + esc(g.name) + ' ?</div>' +
        '<div class="field"><label>Participants (' + modal.selected.length + ' / ' + g.maxPlayers + ' max)</label><div class="chip-grid">' + chips + '</div></div>' +
        '<button class="btn btn-primary" ' + (modal.selected.length < 2 ? "disabled" : "") + ' onclick="App.roundGoToRanking()">Continuer</button>';
    } else if (modal.step === 3) {
      var ranksNow = computeRanksWithTies(modal.order, modal.tiedAfter);
      var rankedRows = modal.order.map(function (pid, idx) {
        var p = getPlayer(pid);
        var rank = ranksNow[idx].rank;
        var tied = !!modal.tiedAfter[idx];
        var badge = '<div class="rank-badge set">' + rank + '</div>';
        var tieBtn = idx > 0 ? '<button class="chip' + (tied ? " selected" : "") + '" style="font-size:0.72rem;padding:6px 10px;flex-shrink:0" onclick="event.stopPropagation();App.roundToggleTie(' + idx + ')">' + (tied ? "Égalité ✓" : "À égalité") + '</button>' : "";
        return '<div class="rank-tap-row done">' +
          '<div style="display:flex;align-items:center;gap:12px;flex:1;cursor:pointer" onclick="App.roundTap(\'' + pid + '\')">' + badge + '<div class="rname">' + esc(p.name) + '</div></div>' +
          tieBtn + '</div>';
      }).join("");
      var unrankedRows = modal.selected.filter(function (pid) { return modal.order.indexOf(pid) === -1; }).map(function (pid) {
        var p = getPlayer(pid);
        return '<div class="rank-tap-row" style="cursor:pointer" onclick="App.roundTap(\'' + pid + '\')"><div class="rank-badge">–</div><div class="rname">' + esc(p.name) + '</div></div>';
      }).join("");
      var allRanked = modal.order.length === modal.selected.length;
      body = '<div class="sheet-title">Ordre d\'arrivée</div><p style="color:var(--muted);font-size:0.86rem;margin-bottom:12px">Touchez les joueurs dans l\'ordre, du 1er au dernier. En cas d\'égalité, utilisez "À égalité" sur le joueur concerné.</p>' +
        '<div class="rank-row-list">' + rankedRows + unrankedRows + '</div>' +
        '<div style="display:flex;gap:8px;margin-top:16px"><button class="btn btn-ghost" onclick="App.roundResetRanking()">Réinitialiser</button></div>' +
        '<button class="btn btn-primary" ' + (allRanked ? "" : "disabled") + ' onclick="App.roundConfirm()" style="margin-top:8px">Valider la manche</button>';
    }
    return '<div class="step-dots">' + dots + '</div>' + body +
      '<button class="btn btn-ghost" style="width:100%;margin-top:10px" onclick="App.roundBack()">' + (modal.step === 1 ? "Annuler" : "Retour") + '</button>';
  }

  function confirmModalHTML() {
    return '<div class="sheet-title">' + esc(modal.title) + '</div><p style="color:var(--ink-soft);line-height:1.45;margin-bottom:20px">' + esc(modal.message) + '</p>' +
      '<button class="btn ' + (modal.danger ? "btn-danger" : "btn-primary") + '" onclick="App.runConfirmed()" style="margin-bottom:8px">' + esc(modal.actionName || "Confirmer") + '</button>' +
      '<button class="btn btn-ghost" style="width:100%" onclick="App.closeModal()">Annuler</button>';
  }
  function infoModalHTML() {
    return '<div class="sheet-title">' + esc(modal.title) + '</div><p style="color:var(--ink-soft);line-height:1.45;margin-bottom:20px">' + esc(modal.message) + '</p>' +
      '<button class="btn btn-primary" onclick="App.closeModal()">Compris</button>';
  }

  renderAll();
})();
</script>
